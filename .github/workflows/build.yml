name: Build

# Builds all of TuxBlox from this repository -- the four programs, the
# interface stack and the compatibility layer -- and publishes it as a GitHub
# release, so the changes in this fork can be installed without the official
# setup server.
#
# The compatibility layer (Wine/Proton) is most of a build's time, so it builds
# on one runner while the programs build on another, and a third job puts the
# two halves together, checks them and packs them. Each half is
# ./build.sh --programs-only or --compat-only, so this runs exactly what a
# local ./build.sh runs.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitlab/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # VERSION already says what this build is; build.sh must not commit it.
  TUXBLOX_NO_VERSION_COMMIT: "1"

jobs:
  build:
    name: Build ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        part: [programs, compat]
    env:
      PART: ${{ matrix.part }}
    steps:
      - name: Make room on the runner
        run: |
          # Toolchains nothing here uses: about 30 GB of the root disk, which is
          # where podman keeps its images.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google
          sudo docker system prune -af > /dev/null || true

          # The runner's second disk, when it has one, takes the checkout (and
          # with it build/, where the layer's objects run to tens of GB) and
          # the compiler cache.
          if mountpoint -q /mnt && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 40 ]; then
            sudo mkdir -p /mnt/workspace /mnt/ccache
            sudo chown "$(id -u):$(id -g)" /mnt/workspace /mnt/ccache
            sudo mount --bind /mnt/workspace "$GITHUB_WORKSPACE"
            echo "CCACHE_DIR=/mnt/ccache" >> "$GITHUB_ENV"
          else
            echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          fi
          df -h / /mnt "$GITHUB_WORKSPACE" || true

      - uses: actions/checkout@v5

      - name: Set up rootless podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman uidmap slirp4netns zstd

          # Ubuntu 24.04 puts unprivileged user namespaces behind AppArmor, and
          # rootless podman runs every container in one.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          for f in /etc/subuid /etc/subgid; do
            grep -q "^$(id -un):" "$f" || echo "$(id -un):100000:65536" | sudo tee -a "$f"
          done

          # The Containerfiles name images like ubuntu:20.04, and without a
          # terminal podman will not ask which registry that means.
          mkdir -p ~/.config/containers
          printf '%s\n' 'unqualified-search-registries = ["docker.io"]' 'short-name-mode = "permissive"' \
            > ~/.config/containers/registries.conf
          podman system migrate
          podman info --format 'podman storage: {{.Store.GraphDriverName}} at {{.Store.GraphRoot}}'

          # The layer's submodules are clones of large projects; fetch them side by side.
          git config --global submodule.fetchJobs 8

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.part }}-

      - name: Build the ${{ matrix.part }} half
        id: build
        # Short of the job's own limit, so a build that runs out of time still
        # saves its compiler cache and the next run picks up from there.
        timeout-minutes: 330
        env:
          # Passed into the layer's build container. One entry this size fits
          # in the 10 GB of Actions cache a repository gets.
          CCACHE_MAXSIZE: 8G
        run: ./build.sh "--$PART-only" --nodebug --log

      - name: Save the compiler cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the build log
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.part }}
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Pack the ${{ matrix.part }} half
        run: |
          if [ "$PART" = programs ]; then
            set -- build/TuxBloxLauncher build/TuxBloxInstaller build/TuxBloxBootstrapper \
                   build/studio-mcp build/libtuxblox build/.provenance shared/ui/dist/ui-stack-*.tar.zst
          else
            set -- build/compat
          fi
          # Packed rather than uploaded as is: an artifact keeps neither
          # symlinks nor the executable bit.
          tar -I 'zstd -T0' -cf "$RUNNER_TEMP/$PART.tar.zst" "$@"
          ls -lh "$RUNNER_TEMP/$PART.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: half-${{ matrix.part }}
          path: ${{ runner.temp }}/${{ matrix.part }}.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  release:
    name: Check, pack and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: half-*
          path: ${{ runner.temp }}/halves
          merge-multiple: true

      - name: Put the two halves together in build/
        run: |
          for half in programs compat; do
            tar -I zstd -xf "$RUNNER_TEMP/halves/$half.tar.zst"
          done
          rm -rf "$RUNNER_TEMP/halves"
          ls -la build

      - name: Install what the programs take from the desktop
        run: |
          # check-host-deps.sh resolves every program with ldd. The launcher and
          # bootstrapper load X11, Wayland and GL from the machine they run on,
          # so those have to be here for it to resolve them.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zstd \
            libx11-6 libx11-xcb1 libxau6 libxdmcp6 libxext6 libxrender1 libxi6 libxrandr2 \
            libxcursor1 libxdamage1 libxfixes3 libxinerama1 libxtst6 libxss1 libxshmfence1 \
            libxcb1 libxcb-render0 libxcb-shm0 libxcb-dri2-0 libxcb-dri3-0 libxcb-glx0 \
            libxcb-present0 libxcb-sync1 libxcb-xfixes0 libxcb-randr0 libxcb-shape0 libxcb-util1 \
            libdrm2 libgbm1 libgl1 libglx0 libegl1 libopengl0 libglvnd0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 libxkbcommon-x11-0

      - name: Check every program loads only what it is expected to
        run: shared/tools/check-host-deps.sh build

      - name: Stage the release folder
        run: ./build.sh --stage-only

      - name: Pack a ready-to-run install
        id: pack
        run: |
          # "3.1.0-stable": what the layer reports, which is what was built.
          built="$(build/compat/main --version | head -1 | tr -d '[:space:]')"
          version="${built%%-*}"
          name="TuxBlox-$version-${GITHUB_SHA::7}-linux-x86_64"

          # build/ is laid out as an install already -- the launcher takes its
          # own folder as the install -- so this is all of it but the hidden
          # build scratch. Moved, not copied: staging is done with it.
          mkdir -p "$RUNNER_TEMP/bundle/TuxBlox"
          mv build/* "$RUNNER_TEMP/bundle/TuxBlox/"
          tar -C "$RUNNER_TEMP/bundle" -I 'zstd -T0 -19' -cf "$RUNNER_TEMP/$name.tar.zst" TuxBlox
          ls -lh "$RUNNER_TEMP/$name.tar.zst"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.name }}.tar.zst
          compression-level: 0
          if-no-files-found: error

      # The setup-server layout (manifest.json, latest.json and the files they
      # name), for anyone serving this fork's builds the way setup.tuxblox.net
      # serves the official ones.
      - uses: actions/upload-artifact@v4
        with:
          name: releases-folder-${{ steps.pack.outputs.version }}
          path: releases/
          compression-level: 0
          if-no-files-found: error

      - name: Publish a GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
          NAME: ${{ steps.pack.outputs.name }}
        run: |
          tag="v$VERSION-fork.$GITHUB_RUN_NUMBER"
          short="${GITHUB_SHA::7}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          TuxBlox $VERSION built from this fork at $short by [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          **To install**, extract it anywhere and start the launcher inside:

          \`\`\`sh
          tar --zstd -xf $NAME.tar.zst
          ./TuxBlox/TuxBloxLauncher
          \`\`\`

          The folder it extracts to is the install: Roblox, its prefix and the launcher's settings all live beside \`TuxBloxLauncher\`.

          **Turn off Auto-Update** in the launcher's settings. The launcher updates from the official TuxBlox server, so with it on, the next official release replaces this build and its changes with it.

          Automatic Studio sign-in: Settings > Roblox account, or start it once with \`./TuxBlox/TuxBloxLauncher --magictoken USERNAME:PASSWORD\`.
          EOF

          # A re-run of the same run publishes under the same tag.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$RUNNER_TEMP/$NAME.tar.zst" \
            --target "$GITHUB_SHA" --title "TuxBlox $VERSION (fork build $short)" \
            --notes-file "$RUNNER_TEMP/notes.md"
